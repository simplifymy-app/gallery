name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build the release APK and bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Collect and verify
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p dist
          apk="dist/simplify-gallery-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/simplify-gallery-${GITHUB_REF_NAME}.aab"
          "$apksigner" verify --print-certs "$apk" | tee cert.txt
          if grep -q "CN=Android Debug" cert.txt; then echo "::error::$apk is signed with the debug key"; exit 1; fi

      - name: Write release notes from commit messages
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+$previous..}$GITHUB_REF_NAME"
          for sha in $(git log --no-merges --format=%H "$range"); do
            subject=$(git log -1 --format=%s "$sha")
            case "$subject" in ci:*|docs:*) continue ;; esac
            printf '### %s\n\n' "$(echo "${subject#*: }" | awk '{ print toupper(substr($0, 1, 1)) substr($0, 2) }')"
            git log -1 --format=%b "$sha" | grep -v '^- Bump version to ' | sed 's/</\&lt;/g' || true
            echo
          done > notes.md
          if [ -n "$previous" ]; then
            echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "Gallery ${GITHUB_REF_NAME}" \
            --notes-file notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ github.ref_name }}
          path: dist/*.aab
